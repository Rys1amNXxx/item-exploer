// Manual acceptance in a disposable client directory. Helpers never enter the release JAR.
gradle.projectsEvaluated {
    rootProject.minecraft.runs.client.workingDirectory = rootProject.file('work/acceptance-ui')
    rootProject.minecraft.runs.client.property 'itemexplorer.review', 'true'
    rootProject.minecraft.runs.client.mods.itemexplorer.source rootProject.sourceSets.gametest
}
